name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          mkdir -p dist/linux-amd64 dist/linux-arm64
          cp systemd/sshkeys-sync@.service systemd/sshkeys-sync@.timer dist/linux-amd64/
          cp systemd/sshkeys-sync@.service systemd/sshkeys-sync@.timer dist/linux-arm64/

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/linux-amd64/sshkeys .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/linux-arm64/sshkeys .
          GOOS=darwin GOARCH=arm64 go build -o dist/sshkeys-darwin-arm64 .

      - name: Validate systemd units
        run: |
          sudo install -m 0755 dist/linux-amd64/sshkeys /usr/local/bin/sshkeys
          systemd-analyze verify systemd/sshkeys-sync@.service systemd/sshkeys-sync@.timer

      - name: Package
        run: |
          tar -C dist/linux-amd64 -czf dist/sshkeys-linux-amd64.tar.gz \
            sshkeys sshkeys-sync@.service sshkeys-sync@.timer
          tar -C dist/linux-arm64 -czf dist/sshkeys-linux-arm64.tar.gz \
            sshkeys sshkeys-sync@.service sshkeys-sync@.timer
          rm -rf dist/linux-amd64 dist/linux-arm64

          expected=$(printf '%s\n' sshkeys 'sshkeys-sync@.service' 'sshkeys-sync@.timer' | LC_ALL=C sort)
          for archive in dist/sshkeys-linux-amd64.tar.gz dist/sshkeys-linux-arm64.tar.gz; do
            actual=$(tar -tzf "$archive" | LC_ALL=C sort)
            test "$actual" = "$expected"
          done

          cd dist
          sha256sum sshkeys-* > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
